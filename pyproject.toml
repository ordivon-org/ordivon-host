[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordivon-host"
version = "0.1.1"
description = "Persistent Agent coordination and commitment plane for Ordivon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "ordivon-protocol @ git+https://github.com/zycxfyh/ordivon-computing.git@b86e94c889188ece477e6af44fb3b04caa9bc10f#subdirectory=packages/ordivon-protocol",
]

[project.scripts]
ordivon-host = "ordivon_host.cli:entrypoint"

[project.urls]
Repository = "https://github.com/zycxfyh/ordivon-host"
Issues = "https://github.com/zycxfyh/ordivon-host/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
