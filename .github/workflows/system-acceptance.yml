name: Host Runtime acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "47 18 * * 0"

permissions:
  contents: read

jobs:
  read-only-host-runtime:
    runs-on: [self-hosted, linux, x64, ordivon-host-runtime]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m pip install --disable-pip-version-check -e .
      - name: Run read-only Host to Runtime acceptance
        env:
          ORDIVON_RUNTIME_ENV_FILE: /etc/ordivon/ordivon-runtime.env
          ORDIVON_MCP_ENDPOINT: http://127.0.0.1:8897/mcp
          ORDIVON_HOST_ACCEPTANCE_OUTPUT: target/acceptance/host-runtime-read.json
        run: |
          set -a
          . "$ORDIVON_RUNTIME_ENV_FILE"
          set +a
          test -n "${ORDIVON_BEARER_TOKEN:-}"
          scripts/local-acceptance run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-runtime-acceptance-${{ github.sha }}
          path: target/acceptance/host-runtime-read.json
          if-no-files-found: error
          retention-days: 30
