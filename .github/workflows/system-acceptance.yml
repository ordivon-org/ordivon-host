name: Host system acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "47 18 * * 0"

permissions:
  contents: read

jobs:
  host-local:
    # Existing self-hosted runner label is retained as infrastructure identity only;
    # this workflow no longer requires or contacts Ordivon Runtime.
    runs-on: [self-hosted, linux, x64, ordivon-host-runtime]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Host acceptance environment
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m pip install --disable-pip-version-check -e '.[mcp]'
      - name: Run Host-owned acceptance
        env:
          ORDIVON_HOST_ACCEPTANCE_OUTPUT: target/acceptance/host-local.json
        run: scripts/local-acceptance run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-local-acceptance-${{ github.sha }}
          path: target/acceptance/host-local.json
          if-no-files-found: error
          retention-days: 30
