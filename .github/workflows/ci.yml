name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.14
          python -m pip install -e .
      - name: Static checks
        run: |
          python -m compileall -q src tests scripts
          ruff check src tests scripts
      - name: Deterministic tests
        run: python -m unittest discover -s tests
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/ordivon-host-wheel .
