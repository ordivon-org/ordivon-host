name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - name: Static and documentation checks
        run: |
          python -m compileall -q src tests scripts
          python -m ruff check src tests scripts
          python scripts/check_docs.py
          scripts/local-acceptance check
      - name: Deterministic tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/ordivon-host-wheel .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - run: python scripts/check_dependencies.py
      - run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
