name: Release acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m pip install --disable-pip-version-check -e '.[mcp]'
          python -m pip check
      - run: python -m compileall -q src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: scripts/local-acceptance check
      - run: python scripts/check_dependencies.py
      - run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/ordivon-host-wheel .
