name: Release acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.17
          python -m pip install --disable-pip-version-check -e .
          python -m pip check
      - run: python -m compileall -q src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: scripts/local-acceptance check
      - run: python scripts/check_dependencies.py
      - run: uvx pip-audit -r requirements-audit.txt --strict --progress-spinner off
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/ordivon-host-wheel .
